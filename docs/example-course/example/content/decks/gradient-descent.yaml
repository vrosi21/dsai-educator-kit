title: Gradient descent
topic: gd
lecture: 02-gradient-descent

cards:
  - id: gd-update
    hy: true
    q: |-
      Write one step of gradient descent.
    a: |-
      $$w \leftarrow w - \eta\, \nabla L(w)$$
    note: |-
      $\eta > 0$ is the learning rate. The minus sign is the whole idea: the gradient points
      uphill.
    hook: |-
      A ball rolls downhill: step *against* the slope.

  - id: gd-gradient
    topic: gd           # optional: overrides the deck's topic for this one card
    q: |-
      Give the gradient of the mean squared loss $L(w) = \frac{1}{n} \lVert y - Xw \rVert^2$.
    a: |-
      $$\nabla L(w) = \frac{2}{n} X^\top (Xw - y)$$

  - id: gd-rate
    cloze: |-
      If the learning rate is too {{large}} the iterates {{diverge}}; if it is too
      {{small}} convergence is {{slow}}.

  - id: gd-one-step
    q: |-
      Data rows $(1,0)$, $(1,1)$, $(1,2)$, targets $y = (1,3,5)^\top$, mean squared loss.
      Take one step from $w = (0,0)^\top$ with $\eta = 0.1$.
    steps:
      - do: |-
          Residual term: $Xw - y = (-1, -3, -5)^\top$.
        why: |-
          At $w = 0$ every prediction is $0$.
      - do: |-
          Gradient: $\frac{2}{3} X^\top (Xw - y) = \frac{2}{3} (-9, -13)^\top = (-6, -\tfrac{26}{3})^\top$.
        why: |-
          First entry sums the residual terms, second weights them by $x = 0, 1, 2$.
      - do: |-
          Step: $w = (0,0)^\top - 0.1\,(-6, -\tfrac{26}{3})^\top = (0.6,\ 0.867)^\top$.
        why: |-
          Subtracting a negative gradient moves both parameters up, towards $(1, 2)$.

  - id: gd-loop
    q: |-
      Write the gradient-descent loop for least squares in NumPy.
    a: |-
      ```python
      w = np.zeros(X.shape[1])
      for _ in range(steps):
          residual = X @ w - y
          w -= eta * (2 / len(y)) * (X.T @ residual)
      ```
    note: |-
      Compute the residual once per step. A loss that goes *up* between steps means `eta`
      is too large.
